<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Área da equipe — VozNaEscola</title><link rel="stylesheet" href="./styles.css?v=dark-theme-1"></head><body><header class="top"><a class="brand" href="./">Voz<span>NaEscola</span></a><nav><a href="./">Voltar ao início</a></nav></header><main class="admin-wrap"><section id="login" class="panel compact"><small>ACESSO RESTRITO</small><h1>Área da equipe</h1><form id="login-form"><label>E-mail institucional<input name="email" type="email" required></label><label>Senha<input name="password" type="password" required></label><button class="btn">Entrar</button><p id="login-status" class="status"></p></form></section><section id="dashboard" class="hidden"><div class="admin-header"><h1>Denúncias recebidas</h1><button class="btn" id="logout">Sair</button></div><p id="staff-name"></p><p class="danger-note">Informações confidenciais. Acesse somente quando necessário e siga o protocolo de proteção da escola.</p><div id="stats" class="stats-grid"></div><div class="admin-filters"><input id="report-search" type="search" placeholder="Buscar por protocolo ou texto"><select id="filter-status"><option value="">Todos os status</option><option value="received">Recebidas</option><option value="reviewing">Em análise</option><option value="resolved">Finalizadas</option></select><select id="filter-category"><option value="">Todas as categorias</option><option value="bullying">Bullying</option><option value="threats">Ameaças</option><option value="violence">Violência</option><option value="harassment">Assédio</option><option value="discrimination">Discriminação</option><option value="property_damage">Danos ao patrimônio</option><option value="cellphone">Celular</option><option value="other">Outra situação</option></select></div><div id="reports"></div></section></main><script type="module" src="./admin.js?v=session-restore-1"></script></body></html>
